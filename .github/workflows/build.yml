
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar archivos web
        run: |
          mkdir -p www
          cp index.html www/index.html
          test -s www/index.html
          echo "Contenido de www:"
          ls -la www

      - name: Preparar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 capacitor-secure-storage-plugin@0.10
          npx cap init Umbral com.umbral.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Verificar archivos Android
        run: |
          ls -la android/app/src/main/assets/public/
          test -s android/app/src/main/assets/public/index.html

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: umbral-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
